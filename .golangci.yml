# Baseline lint config. Will be re-derived from coding_standards.json once that file lands.
version: "2"

run:
  timeout: 5m
  tests: true

formatters:
  enable:
    - gofumpt
    - goimports

linters:
  default: standard
  enable:
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - gosec
    - bodyclose
    - contextcheck
    - dupl
    - copyloopvar
    - nilerr
    - nolintlint
    - prealloc
    - rowserrcheck
    - sqlclosecheck

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gosec
          - errcheck

  settings:
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: exported
          arguments: ["disableStutteringCheck"]
    gosec:
      excludes:
        - G104 # errcheck handles this
