version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries"
    schema: "migrations"
    gen:
      go:
        package: "dbq"
        out: "internal/database/dbq"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_db_tags: false
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type: "github.com/google/uuid.NullUUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "citext"
            go_type: "string"
          - db_type: "inet"
            go_type: "net/netip.Addr"
            nullable: true
